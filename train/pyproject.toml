[tool.black]
line-length = 240

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.7.0.dev0"
description = "VidLaDA: Bidirectional Diffusion Large Language Models for Efficient Video Understanding"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
standalone = [
    "shortuuid",
    "httpx==0.24.0",
    "einops",
    "ftfy",
]


train = [
    "llava[standalone]",
    #"numpy==1.26.1",
    "open_clip_torch",
    "fastapi",
    #"markdown2[all]", this is not work for h20
    "numpy",
    "requests",
    "sentencepiece",
    #"torch==2.1.2",
    #"torchvision==0.16.2",
    "uvicorn",
    "wandb",
    "deepspeed==0.14.4",
    "peft==0.9.0",
    "accelerate==0.29.1",
    "tokenizers==0.19.1",
    "transformers==4.43.4",
    "triton==3.1.0",
    "bitsandbytes==0.45.3",
    "scikit-learn==1.7.2",
    "sentencepiece~=0.1.99",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "gradio_client==0.2.9",
    "urllib3<=2.0.0",
    "datasets==2.20.0",
    "pydantic==1.10.8",
    "timm",
    "hf_transfer",
    "opencv-python",
    "av",
    "decord",
    "tyro",
    "scipy",
    "jinja2==3.1.5",
    "pynvml",
]

[tool.setuptools.packages.find]
include = ["llava*", "trl*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]
